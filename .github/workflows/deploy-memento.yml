name: Deploy MEMENTO to GitHub Pages

# Officiële GitHub Pages-flow: configure-pages zet Pages aan (build type
# "workflow"), upload de map memento/ als artifact en deployt die.
# App komt live op https://jimmymiddendorp.github.io/JimmyMiddendorp/

on:
  push:
    branches: ["claude/memento-mori-app-d03lqz"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (zet Pages aan)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload app als Pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./memento

      - name: Deploy naar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
