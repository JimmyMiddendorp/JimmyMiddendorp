name: Deploy MEMENTO to GitHub Pages

# Publiceert de app (map memento/) naar de gh-pages branch en zet
# GitHub Pages aan met die branch als bron. Zo komt de app live op
# https://jimmymiddendorp.github.io/JimmyMiddendorp/ zonder handmatige stappen.

on:
  push:
    branches: ["claude/memento-mori-app-d03lqz"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: "memento-pages"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish memento/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./memento
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy MEMENTO app"

      - name: Enable GitHub Pages (bron = gh-pages)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/${{ github.repository }}/pages"
          body='{"source":{"branch":"gh-pages","path":"/"}}'
          code=$(curl -s -o /tmp/post.json -w "%{http_code}" -X POST "$API" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$body")
          echo "POST /pages -> $code"; cat /tmp/post.json 2>/dev/null || true; echo
          if [ "$code" != "201" ] && [ "$code" != "204" ]; then
            code=$(curl -s -o /tmp/put.json -w "%{http_code}" -X PUT "$API" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d "$body")
            echo "PUT /pages -> $code"; cat /tmp/put.json 2>/dev/null || true; echo
          fi
          echo "Huidige Pages-status:"
          curl -s "$API" -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" | tee /tmp/status.json; echo
