name: Publish MEMENTO

# Publiceert de app (map memento/) naar de gh-pages branch bij elke push.
# Die branch is publiek en wordt live geserveerd via een GitHub-CDN
# (githack), zodat de app een werkende online link heeft zonder dat er
# handmatig GitHub Pages of Cloudflare aangezet hoeft te worden.
#
# Wil je later een eigen domein? Zet dan GitHub Pages aan (bron: gh-pages)
# of koppel Cloudflare Pages — zie DEPLOY.md.

on:
  push:
    branches: ["claude/memento-mori-app-d03lqz"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "memento-publish"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish memento/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./memento
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publish MEMENTO app"
